[project]
name = "debidorshon-script"
version = "0.1.0"
description = "Developer tooling and dataset scripts for Debi-Dorshon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1.5",
    "requests>=2.34.2",
    "motor>=3.3.2",
    "pymongo>=4.6.0",
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.110.0",
]

[tool.pyright]
extraPaths = ["../server"]

